# Soccer Intelligence – Container-Konfiguration (Stand 31.10.2026, Etappe E; seit 15.11.2026 mit Datenimport, Version 0.14)
#
#   https://soccer-intelligence.com/             -> Platzhalterseite, öffentlich (Container soccer-placeholder)
#   https://soccer-intelligence.com/dashboard…   -> Streamlit-Dashboard mit Anmeldemaske (seit 0.15.2; bis 0.15.1 Traefik BasicAuth)
#   https://soccer-intelligence.com/vorschau…    -> Vorschau der öffentlichen Website (seit 0.17, Container soccer-vorschau),
#                                                  mit Passwortabfrage des Browsers (Traefik BasicAuth, Hash in .env als
#                                                  SOCCER_VORSCHAU_AUTH; fehlt er, ist die Vorschau nicht erreichbar)
#
# Zugangsdaten: Benutzername und Passwort-Hash NUR in .env auf dem Server (SI_LOGIN_USER, SI_LOGIN_HASH), nie in Git.
# Fehlen sie, bleibt das Dashboard gesperrt (Hinweis statt Inhalt). SOCCER_DASHBOARD_AUTH (BasicAuth bis 0.15.1) bleibt in
# .env stehen, damit ein Rückweg auf eine ältere Version funktioniert.
# Betroffen sind nur die Labels dieser beiden Container. Die Traefik-Grundkonfiguration bleibt unverändert.
#
# soccer-import (seit Version 0.14): holt täglich um 04:00 die Daten von API-Football, legt neue Fassungen in
# ./import ab und tauscht sie nach Freigabe aus (nur er schreibt in ./data). Kein Zugang von aussen (keine Labels,
# kein Port). Der API-Schlüssel steht NUR in .env (Variable API_FOOTBALL_KEY), nie in Git. Fehlt er, startet der
# Container trotzdem und meldet „API-Schlüssel fehlt“ im Bereich Datenimport/API.

services:
  football-dashboard:
    build:
      context: /docker/football-dashboard
    container_name: football-dashboard
    mem_limit: 1g                                  # seit 0.24: Obergrenze (gemessen 24.11.2026 im Ruhezustand: 110–170 MiB; Import mit Reserve für den Bau der Excel-Fassung)
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]        # seit 0.24 (Backend-Review C): keine Rechteausweitung im Container
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./data:/data:ro
      - ./import:/import:ro                       # Stand des Datenimports (nur lesen)
      - ./import/anfragen:/import/anfragen        # nur hier schreibt das Dashboard: Freigabe-Anfragen
    environment:
      # Streamlit läuft unter dem Pfad /dashboard (Seiten: /dashboard/bundesliga usw.)
      - STREAMLIT_SERVER_BASE_URL_PATH=dashboard
      # Anmeldemaske (seit 0.15.2): Benutzername und Passwort-Hash NUR in .env, nie in Git (01, Abschnitt 6.6)
      - SI_LOGIN_USER=${SI_LOGIN_USER:-}
      - SI_LOGIN_HASH=${SI_LOGIN_HASH:-}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.soccer.rule=Host(`soccer-intelligence.com`) && PathPrefix(`/dashboard`)"
      - "traefik.http.routers.soccer.entrypoints=websecure"
      - "traefik.http.routers.soccer.tls.certresolver=letsencrypt"
      # Seit 0.15.2 ohne Passwortabfrage des Browsers (BasicAuth): Die Anmeldung macht das Dashboard selbst.
      # Anfragebremse je Besucher-Adresse gegen Durchprobieren (eine Seite lädt rund 30 Dateien auf einmal).
      - "traefik.http.routers.soccer.middlewares=soccerintel-ratelimit,soccerintel-noindex,soccerintel-hsts"
      - "traefik.http.middlewares.soccerintel-ratelimit.ratelimit.average=30"
      - "traefik.http.middlewares.soccerintel-ratelimit.ratelimit.burst=100"
      - "traefik.http.middlewares.soccerintel-noindex.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow"
      - "traefik.http.services.soccer.loadbalancer.server.port=8501"

  soccer-import:
    build:
      context: /docker/football-dashboard
    container_name: soccer-import
    mem_limit: 1536m                                  # seit 0.24: Obergrenze (gemessen 24.11.2026 im Ruhezustand: 110–170 MiB; Import mit Reserve für den Bau der Excel-Fassung)
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]        # seit 0.24 (Backend-Review C): keine Rechteausweitung im Container
    command: ["python", "-m", "importer.dienst"]
    volumes:
      - ./data:/data                              # schreibt neue Fassungen erst nach Freigabe (Tausch in einem Schritt)
      - ./import:/import                          # Rohdaten, Läufe, Berichte, Anfragen
      - ./backup:/backup                          # ersetzte Fassungen mit Datum (seit 0.22 gestaffelt aufbewahrt)
    environment:
      - API_FOOTBALL_KEY=${API_FOOTBALL_KEY:-}
      - TZ=Europe/Zurich
      # Mailversand für Alarme und Statusmail (seit 0.23, docs/09): Zugangsdaten des Postfachs NUR in .env, nie in Git
      - SI_SMTP_HOST=${SI_SMTP_HOST:-}
      - SI_SMTP_PORT=${SI_SMTP_PORT:-}
      - SI_SMTP_USER=${SI_SMTP_USER:-}
      - SI_SMTP_PASSWORT=${SI_SMTP_PASSWORT:-}
      - SI_ALARM_AN=${SI_ALARM_AN:-}

  soccer-vorschau:
    # Vorschau der öffentlichen Website (seit 0.17, docs/08_Website.md): erzeugt die Seiten bei jedem Aufruf neu,
    # auch für ein anderes Datum (?datum=…, Zeitreise). Liest data/ und import/ nur. Kein Port nach aussen.
    build:
      context: /docker/football-dashboard
    container_name: soccer-vorschau
    mem_limit: 1g                                  # seit 0.24: Obergrenze (gemessen 24.11.2026 im Ruhezustand: 110–170 MiB; Import mit Reserve für den Bau der Excel-Fassung)
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]        # seit 0.24 (Backend-Review C): keine Rechteausweitung im Container
    command: ["python", "-m", "website.vorschau"]
    volumes:
      - ./data:/data:ro
      - ./import:/import:ro
      - ./import/meldungen:/meldungen               # seit 0.23: nur hier schreibt die Website (Versand gescheitert)
      - ./website-bilder:/bilder:ro                 # Foto der Startseite (seit 0.18), nur auf dem Server, nicht in Git
    environment:
      - TZ=Europe/Zurich
      - SI_VORSCHAU_PORT=8080
      # Kontaktformular (seit 0.23, docs/09, Abschnitt 6): Zugangsdaten des Postfachs NUR in .env, nie in Git
      - SI_SMTP_HOST=${SI_SMTP_HOST:-}
      - SI_SMTP_PORT=${SI_SMTP_PORT:-}
      - SI_SMTP_USER=${SI_SMTP_USER:-}
      - SI_SMTP_PASSWORT=${SI_SMTP_PASSWORT:-}
      - SI_KONTAKT_AN=${SI_KONTAKT_AN:-}
      # Betreiberangaben für Impressum und Kontakt (seit 0.21): NUR in .env auf dem Server, nie in Git.
      # Adresse mit „|“ getrennt (Strasse|PLZ Ort|Land). Fehlen sie, zeigt die Seite einen Platzhalter.
      - SI_IMPRESSUM_NAME=${SI_IMPRESSUM_NAME:-}
      - SI_IMPRESSUM_ADRESSE=${SI_IMPRESSUM_ADRESSE:-}
      - SI_KONTAKT_EMAIL=${SI_KONTAKT_EMAIL:-}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.soccervorschau.rule=Host(`soccer-intelligence.com`) && PathPrefix(`/vorschau`)"
      - "traefik.http.routers.soccervorschau.entrypoints=websecure"
      - "traefik.http.routers.soccervorschau.tls.certresolver=letsencrypt"
      - "traefik.http.routers.soccervorschau.middlewares=soccervorschau-auth,soccerintel-ratelimit,soccerintel-noindex,soccerintel-compress,soccerintel-hsts"
      # Seit 0.24 (Frontend-Review 1 und 19): Traefik komprimiert HTML, CSS und JS (gzip/Brotli) und sendet HSTS
      # (Browser nutzen ein Jahr lang nur HTTPS). Nur für unsere Router; die Traefik-Grundkonfiguration bleibt unverändert.
      - "traefik.http.middlewares.soccerintel-compress.compress=true"
      - "traefik.http.middlewares.soccerintel-hsts.headers.stsSeconds=31536000"
      # Passwortabfrage des Browsers; Benutzer und bcrypt-Hash NUR in .env (tools/vorschau_passwort.sh), nie in Git
      - "traefik.http.middlewares.soccervorschau-auth.basicauth.users=${SOCCER_VORSCHAU_AUTH:-}"
      - "traefik.http.services.soccervorschau.loadbalancer.server.port=8080"

  soccer-website:
    # Öffentliche Website (seit 0.27, Livegang 26.11.2026, docs/08_Website.md): dieselbe Software wie die Vorschau,
    # aber unter / ohne Passwort, ohne Zeitreise und ohne Vorschau-Leiste (SI_VORSCHAU_PREFIX leer). Die Vorschau bleibt
    # als Testumgebung unter /vorschau. Liest data/ und import/ nur. Kein Port nach aussen.
    # Vorrang vor der Platzhalterseite über die Router-Priorität 40 (die Regeln für /dashboard und /vorschau sind
    # länger und gewinnen weiter). Rückweg auf die Platzhalterseite: docker compose stop soccer-website (01, 6.7).
    build:
      context: /docker/football-dashboard
    container_name: soccer-website
    mem_limit: 1g
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    command: ["python", "-m", "website.vorschau"]
    volumes:
      - ./data:/data:ro
      - ./import:/import:ro
      - ./import/meldungen:/meldungen               # Kontaktformular: Meldung, wenn der Versand scheitert
      - ./website-bilder:/bilder:ro
    environment:
      - TZ=Europe/Zurich
      - SI_VORSCHAU_PORT=8080
      - SI_VORSCHAU_PREFIX=
      - SI_SMTP_HOST=${SI_SMTP_HOST:-}
      - SI_SMTP_PORT=${SI_SMTP_PORT:-}
      - SI_SMTP_USER=${SI_SMTP_USER:-}
      - SI_SMTP_PASSWORT=${SI_SMTP_PASSWORT:-}
      - SI_KONTAKT_AN=${SI_KONTAKT_AN:-}
      - SI_IMPRESSUM_NAME=${SI_IMPRESSUM_NAME:-}
      - SI_IMPRESSUM_ADRESSE=${SI_IMPRESSUM_ADRESSE:-}
      - SI_KONTAKT_EMAIL=${SI_KONTAKT_EMAIL:-}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.soccerweb.rule=Host(`soccer-intelligence.com`)"
      - "traefik.http.routers.soccerweb.priority=40"
      - "traefik.http.routers.soccerweb.entrypoints=websecure"
      - "traefik.http.routers.soccerweb.tls.certresolver=letsencrypt"
      # Eigene Middlewares (gleiche Werte wie Dashboard/Vorschau): Die Website hängt nicht an den Labels anderer
      # Container – sonst fiele sie beim Neubau oder Stopp von Dashboard/Vorschau kurz auf die Platzhalterseite zurück.
      - "traefik.http.routers.soccerweb.middlewares=soccerweb-ratelimit,soccerweb-compress,soccerweb-hsts"
      - "traefik.http.routers.soccerweb.service=soccerweb"
      - "traefik.http.middlewares.soccerweb-ratelimit.ratelimit.average=30"
      - "traefik.http.middlewares.soccerweb-ratelimit.ratelimit.burst=100"
      - "traefik.http.middlewares.soccerweb-compress.compress=true"
      - "traefik.http.middlewares.soccerweb-hsts.headers.stsSeconds=31536000"
      # www (seit 0.27.1, Entscheid Carsten 25.11.2026): eigener Router mit Zertifikat für www.soccer-intelligence.com,
      # leitet jede Adresse dauerhaft auf dieselbe Adresse ohne www weiter (http → https erledigt Traefik selbst).
      # In Compose steht "$$" für ein "$"; "${1}" ist der Pfad aus dem regulären Ausdruck.
      - "traefik.http.routers.soccerwww.rule=Host(`www.soccer-intelligence.com`)"
      - "traefik.http.routers.soccerwww.entrypoints=websecure"
      - "traefik.http.routers.soccerwww.tls.certresolver=letsencrypt"
      - "traefik.http.routers.soccerwww.middlewares=soccerweb-ratelimit,soccerweb-hsts,soccerweb-www"
      - "traefik.http.routers.soccerwww.service=soccerweb"
      - "traefik.http.middlewares.soccerweb-www.redirectregex.regex=^https?://www\\.soccer-intelligence\\.com/(.*)"
      - "traefik.http.middlewares.soccerweb-www.redirectregex.replacement=https://soccer-intelligence.com/$${1}"
      - "traefik.http.middlewares.soccerweb-www.redirectregex.permanent=true"
      - "traefik.http.services.soccerweb.loadbalancer.server.port=8080"

  soccer-placeholder:
    image: nginx:1.27-alpine
    container_name: soccer-placeholder
    restart: unless-stopped
    volumes:
      - ./placeholder:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.soccer-placeholder.rule=Host(`soccer-intelligence.com`)"
      - "traefik.http.routers.soccer-placeholder.entrypoints=websecure"
      - "traefik.http.routers.soccer-placeholder.tls.certresolver=letsencrypt"
      - "traefik.http.services.soccer-placeholder.loadbalancer.server.port=80"
