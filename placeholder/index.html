<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soccer Intelligence</title>
<meta name="description" content="Soccer Intelligence – statistische Auffälligkeiten im Fussball, verständlich erklärt. Die Website befindet sich im Aufbau.">
<style>
  /* Platzhalterseite (Etappe E). Keine externen Schriften, Skripte oder Tracker. */
  :root { --ink:#14213d; --muted:#5b6b84; --bar:#343a40; --accent:#4a90e2; --bg:#f5f7fa; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { font-family:-apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
         color:var(--ink); background:var(--bg); display:flex; flex-direction:column; }
  header { background:var(--bar); height:3rem; }
  main { flex:1; display:flex; align-items:center; justify-content:center; padding:2rem 1rem; }
  .box { max-width:34rem; text-align:center; }
  h1 { font-size:clamp(2rem, 6vw, 2.8rem); margin:0 0 .6rem; letter-spacing:-.01em; }
  .line { width:3.5rem; height:4px; background:var(--accent); border-radius:2px; margin:0 auto 1.4rem; }
  p { font-size:1.1rem; line-height:1.55; margin:0 0 .8rem; }
  .muted { color:var(--muted); font-size:1rem; }
  footer { text-align:center; color:var(--muted); font-size:.85rem; padding:1.2rem; }
</style>
</head>
<body>
<header></header>
<main>
  <div class="box">
    <h1>Soccer Intelligence</h1>
    <div class="line"></div>
    <p>Statistische Auffälligkeiten im Fussball – verständlich erklärt.</p>
    <p class="muted">Diese Website befindet sich im Aufbau.</p>
  </div>
</main>
<footer>© 2026 Soccer Intelligence</footer>
</body>
</html>
