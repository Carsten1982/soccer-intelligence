# Soccer Intelligence – Schwellen und Prognosewerte (KPI-Regelwerk 2.2, seit Version 0.19)
#
# Je Liga, KPI und Richtung (mehr / weniger) höchstens eine Schwelle. Auffällig ist eine Kennzahl, wenn der Betrag der
# auf zwei Stellen gerundeten Abweichung GRÖSSER als die Schwelle ist (mehr: > +Schwelle, weniger: < −Schwelle).
# Genau auf der Schwelle: nicht auffällig. Nicht aufgeführte Kombinationen haben keine Schwelle (nie auffällig).
#
# Herleitung (Regelwerk 11, Sensitivitätsanalyse): Kandidaten 10/15/20/25/30/35 %. In Frage kommen nur Schwellen mit
# Empfehlung „Funktioniert“ (mindestens 50 Spiele, Mehrwert ≥ +5 Pp., linker Rand der Spanne > +2 Pp.), die stabil
# sind (Mehrwert in mindestens zwei Dritteln der Saisons positiv). Prognosewert: hoch = Trefferquote ≥ 60 % und
# Mehrwert ≥ +8 Pp.; mittel ≥ 55 %; gering ≥ 50 %. Gewählt wird je Kombination die Schwelle mit dem besten
# Prognosewert, bei Gleichstand die mit mehr Spielen. Keine Handanpassung.
#
# Änderungen nur einmal pro Saison nach Saisonende: Vorschlag aus der Sensitivitätsanalyse, Freigabe durch Carsten,
# Übernahme über GitHub (Neubau, CHANGELOG). Fassung bis Version 0.18 (leicht/stark): archiv/schwellen_2026-11-14.toml.

