# Soccer Intelligence – Teamnamen von API-Football (Entscheidung Carsten 15.11.2026, E6/E14)
#
# Je Team: api_team_id (feste Nummer bei API-Football), name (Name von API-Football, hier festgehalten) und
# alt (bisherige Schreibweise der Datenbank, nur für die einmalige Umbenennung beim ersten Import).
# Ein Team, das hier fehlt (z. B. ein Aufsteiger), wird beim Import gemeldet und mit dem Namen der API übernommen.
# alt darf auch eine Liste sein. Seit 15.11.2026 (Entscheidung Carsten) mit ü und Akzenten, wo die API sie weglässt
# (z. B. Fortuna Düsseldorf, Atlético Madrid); alt enthält dann auch die Schreibweise der API.
# Ändert die API später einen Namen, gilt weiter der Name hier; die Abweichung wird gemeldet.
# Erzeugt am 15.11.2026 aus dem Vollvergleich (Zuordnung über Datum und Ergebnis, alle Saisons 2018/19–2026/27;
# name = Schreibweise der API in der jüngsten Saison des Teams).

