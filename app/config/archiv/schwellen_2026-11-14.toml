# Soccer Intelligence – Schwellenwerte der Anomalie-Einstufung (KPI-Regelwerk, Abschnitt 2.2)
#
# Eingestuft wird die auf zwei Nachkommastellen gerundete relative Abweichung, positiv und negativ getrennt:
#   positiv: bis leicht_positiv -> keine Anomalie, bis stark_positiv -> leichte, darüber -> starke Anomalie
#   negativ: bis leicht_negativ -> keine Anomalie, bis stark_negativ -> leichte, darunter -> starke Anomalie
#   Genau auf der Schwelle zählt zur schwächeren Stufe (z. B. genau +20,00 % bei 20 = keine Anomalie).
#
# Änderungen nur bewusst über diese Datei: Neubau des Containers, Git-Commit und Eintrag im CHANGELOG.
# Die gültigen Werte zeigt das Dashboard im Bereich Datenqualität.
# Festgelegt von Carsten am 14.11.2026 (Version 0.13) mit der Sensitivitätsanalyse: alle Ligen, Saisons
# 2019/20–2025/26. Je KPI eine Schwelle für alle Ligen; nur KPI 03 je Liga, weil er an der festen Marke
# 2,5 Tore misst und nicht an der Ligareferenz.
#
# Aufbau: [standard] gilt, wo keine Abweichung passt (z. B. für eine neue Liga bei KPI 03).
# Vorrang der Abweichungen: Liga und KPI > nur KPI > nur Liga > Standard.
# Eine Abweichung nennt entweder leicht/stark (gleich für beide Richtungen) oder die vier Felder unten.

[standard]
leicht = 20
stark = 35

# KPI 02 – Erwartete Tore
[[abweichung]]
kpi = "kpi02"
leicht_positiv = 20
stark_positiv = 30
leicht_negativ = -15
stark_negativ = -25

# KPI 03 – Über 2,5 Tore, Bundesliga
[[abweichung]]
liga = "Bundesliga"
kpi = "kpi03"
leicht_positiv = 35
stark_positiv = 40
leicht_negativ = -5
stark_negativ = -10

