# Soccer Intelligence – automatische Tests auf GitHub (seit 09.11.2026).
#
# Läuft bei jedem Push auf main, bei jedem Pull Request und auf Knopfdruck ("Run workflow").
# Dieselben Tests wie auf dem Server (Python 3.12, requirements-dev.txt), aber ohne die Excel-Dateien aus data/
# (die liegen nur auf dem Server): Tests, die data/ brauchen, werden übersprungen; die KPI-Testfälle laufen
# mit den Referenz-Datenbanken aus tests/referenz/. Dazu kommen die Probeläufe der Einspiel-Skripte.
# Der Workflow liest nur (permissions: contents: read) und berührt den Server nicht.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Pakete installieren
        run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider tests
